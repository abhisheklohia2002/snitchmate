name: StitchMate checks
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @stitchmate/api prisma:generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/stitchmate
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
