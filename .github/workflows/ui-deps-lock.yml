name: Refresh Ant Design dependency lockfile
on:
  push:
    branches: [feature/antd-theme-notifications-20261113]
    paths: [apps/web/package.json]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/antd-theme-notifications-20261113
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Update frozen pnpm dependency lock
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(web): lock Ant Design and SSR registry versions"
            git push origin HEAD:feature/antd-theme-notifications-20261113
          fi
