name: Generate Ant Design lockfile (temporary)
on:
  pull_request:
    branches: [main]
    paths: [apps/web/package.json, .github/workflows/antd-lockfile.yml]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/antd-themes-personal-notifications-20261114
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Commit regenerated pnpm-lock.yaml
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then echo "Lockfile unchanged"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh lockfile for Ant Design 6"
          git push origin HEAD:feature/antd-themes-personal-notifications-20261114
