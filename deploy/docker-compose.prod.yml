# Single-VPS BETA deployment. PostgreSQL/Redis are private and persisted.
# Requires /opt/stitchmate/shared/.env.production and a committed pnpm-lock.yaml.
# Object storage should be private S3/Spaces, NOT a local ephemeral filesystem.
name: stitchmate
x-app: &app
  image: stitchmate/app:${RELEASE_SHA:?RELEASE_SHA must be specified}
  env_file:
    - /opt/stitchmate/shared/.env.production
  restart: unless-stopped
  init: true

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stitchmate
      POSTGRES_DB: stitchmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stitchmate -d stitchmate"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No host ports: database must NEVER be public.

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No host ports: Redis must NEVER be public.

  api:
    <<: *app
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_OTP_CHANNEL: whatsapp
    command: ["pnpm", "--filter", "@stitchmate/api", "start"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal, web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  web:
    <<: *app
    command: ["pnpm", "--filter", "@stitchmate/web", "start"]
    depends_on:
      api: {condition: service_healthy}
    networks: [web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
    networks: [internal, web]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_healthy}
    networks: [web]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  web:
