# StitchMate Render staging stack (Nov 2026)
# Review costs and populate all sync:false secrets in the Render dashboard.
# This is a paid, non-public-launch staging configuration.
services:
  - type: keyvalue
    name: stitchmate-kv
    region: singapore
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: stitchmate-api
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: pnpm --filter @stitchmate/api start
    preDeployCommand: pnpm --filter @stitchmate/api prisma:deploy
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_LAUNCH_ENABLED
        value: 'false'
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stitchmate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stitchmate-kv
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: MOCK_OTP_ENABLED
        value: 'false'
      - key: MOCK_PAYMENT_ENABLED
        value: 'false'
      - key: ENABLE_DEMO_PAYMENT_CONFIRM
        value: 'false'
      - key: SMS_PROVIDER
        value: msgkart
      - key: MSGKART_API_URL
        value: https://alb-backend.msgkart.com/api/v1
      - key: MSGKART_BUSINESS_ID
        sync: false
      - key: MSGKART_API_KEY
        sync: false
      - key: MSGKART_PHONE_ID
        sync: false
      - key: MSGKART_OTP_TEMPLATE_NAME
        sync: false
      - key: MSGKART_OTP_TEMPLATE_LANGUAGE
        value: en_US
      - key: MSGKART_OTP_BUTTON_MODE
        value: copy_code
      - key: MSGKART_HANDOFF_TEMPLATE_NAME
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'false'
      - key: PLATFORM_COMMISSION_BPS
        value: '1500'
      - key: FIT_CLAIM_WINDOW_HOURS
        value: '48'
      - key: ADMIN_BOOTSTRAP_PHONE
        sync: false

  - type: web
    name: stitchmate-web
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c 'pnpm --filter @stitchmate/web exec next start -H 0.0.0.0 -p "${PORT:-10000}"'
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: /api/v1
      - key: NEXT_PUBLIC_OTP_CHANNEL
        value: whatsapp
      - key: API_INTERNAL_HOSTPORT
        fromService:
          type: web
          name: stitchmate-api
          property: hostport

  - type: worker
    name: stitchmate-worker
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node apps/worker/dist/main.js
    envVars:
      # Staging only: no customer WhatsApp messages will be sent.
      # To activate production notifications, set NODE_ENV=production,
      # NOTIFICATION_PROVIDER=twilio, and all approved Twilio template secrets.
      - key: NODE_ENV
        value: development
      - key: NOTIFICATION_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: stitchmate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stitchmate-kv
          property: connectionString

databases:
  - name: stitchmate-db
    databaseName: stitchmate
    user: stitchmate
    region: singapore
    plan: basic-1gb
    postgresMajorVersion: '17'
    ipAllowList: []
