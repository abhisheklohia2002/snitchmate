# StitchMate FREE staging on Render. NO PAID RESOURCES.
# Uses the existing free Render PostgreSQL "stitchmate-db-free" (expires 2026-12-11).
# Background worker and Redis disabled until a suitable queue is available.
# Secrets are generated by Render; no .env files are uploaded to GitHub.
services:
  - type: web
    name: stitchmate-api-preview
    runtime: node
    plan: free
    region: singapore
    branch: deploy/render-staging-20261111
    autoDeployTrigger: off
    buildCommand: corepack enable && corepack prepare pnpm@10.8.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @stitchmate/contracts build && pnpm --filter @stitchmate/domain build && pnpm --filter @stitchmate/api prisma:generate && pnpm --filter @stitchmate/api build
    # Free web services cannot use preDeployCommand: run forward-only migrations at startup.
    startCommand: pnpm --filter @stitchmate/api prisma:deploy && pnpm --filter @stitchmate/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      # Testing only. Never activate mock OTP or payments on a public URL.
      - key: NODE_ENV
        value: development
      - key: PUBLIC_LAUNCH_ENABLED
        value: "false"
      - key: WEB_ORIGIN
        value: https://stitchmate-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: stitchmate-db-free
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: MOCK_OTP_ENABLED
        value: "false"
      - key: MOCK_PAYMENT_ENABLED
        value: "false"
      - key: ENABLE_DEMO_PAYMENT_CONFIRM
        value: "false"
      - key: PLATFORM_COMMISSION_BPS
        value: "1500"
      - key: FIT_CLAIM_WINDOW_HOURS
        value: "48"
