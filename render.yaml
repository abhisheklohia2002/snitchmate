# StitchMate staging resources on Render
# Created on a deployment-only branch to avoid the old DigitalOcean auto-deploy.
# Import as a Blueprint only after configuring Render billing. Do not merge to main
# until the DigitalOcean workflow has been explicitly retired.
# Cost estimate: PostgreSQL $19 + Key Value $10 + API $7 + Worker $7 / month.
services:
  - type: keyvalue
    name: stitchmate-redis
    region: singapore
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: stitchmate-api
    runtime: node
    region: singapore
    plan: starter
    branch: deploy/render-staging-20261111
    autoDeployTrigger: off
    buildCommand: corepack enable && corepack prepare pnpm@10.8.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @stitchmate/api prisma:generate && pnpm build
    preDeployCommand: pnpm --filter @stitchmate/api prisma:deploy
    startCommand: pnpm --filter @stitchmate/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_LAUNCH_ENABLED
        value: "false"
      - key: WEB_ORIGIN
        value: https://stitchmate-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: stitchmate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stitchmate-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: MOCK_OTP_ENABLED
        value: "false"
      - key: MOCK_PAYMENT_ENABLED
        value: "false"
      - key: ENABLE_DEMO_PAYMENT_CONFIRM
        value: "false"
      - key: SMS_PROVIDER
        value: msgkart
      - key: MSGKART_API_URL
        value: https://alb-backend.msgkart.com/api/v1
      - key: MSGKART_BUSINESS_ID
        sync: false
      - key: MSGKART_API_KEY
        sync: false
      - key: MSGKART_PHONE_ID
        sync: false
      - key: MSGKART_OTP_TEMPLATE_NAME
        sync: false
      - key: MSGKART_OTP_TEMPLATE_LANGUAGE
        value: en_US
      - key: MSGKART_OTP_BUTTON_MODE
        value: copy_code
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: PLATFORM_COMMISSION_BPS
        value: "1500"
      - key: FIT_CLAIM_WINDOW_HOURS
        value: "48"
      - key: ADMIN_BOOTSTRAP_PHONE
        sync: false

  - type: worker
    name: stitchmate-worker
    runtime: node
    region: singapore
    plan: starter
    branch: deploy/render-staging-20261111
    autoDeployTrigger: off
    buildCommand: corepack enable && corepack prepare pnpm@10.8.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @stitchmate/api prisma:generate && pnpm build
    startCommand: node apps/worker/dist/main.js
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      # Staging: do not deliver customer WhatsApp messages until approved templates exist.
      - key: NODE_ENV
        value: development
      - key: NOTIFICATION_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: stitchmate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stitchmate-redis
          property: connectionString

databases:
  - name: stitchmate-db
    databaseName: stitchmate
    user: stitchmate
    region: singapore
    plan: basic-1gb
    postgresMajorVersion: "16"
    diskSizeGB: 1
    ipAllowList: []
